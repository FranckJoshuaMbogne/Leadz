name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  # Rebuild nightly so search engines see the latest admin changes
  # (visitors see them instantly).
  schedule:
    - cron: "15 21 * * *" # 02:45 IST
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEADZINDB }}
          channelId: live
          projectId: leadzindb
